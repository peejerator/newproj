name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --python 3.11
      - name: Run tests
        run: uv run pytest
      - name: Run state.py under Python 3.9
        shell: bash
        run: |
          # Full history, so check can resolve the task's Base commit.
          git fetch --quiet --unshallow || true
          uv python install 3.9
          uv run --no-project --python 3.9 template/.agents/skills/resume/scripts/state.py --neutral-dir template/.agents/skills/handoff/neutral
          uv run --no-project --python 3.9 template/.agents/skills/resume/scripts/state.py check --neutral-dir template/.agents/skills/handoff/neutral
