[project]
name = "newproj"
version = "0.1.0"
description = "Create and adopt projects with repository-based state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["copier>=9.18.2,<10"]

[project.scripts]
newproj = "newproj.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
